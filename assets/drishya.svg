<rect x="179.7" y="162" width="54.5" height="26" rx="13.0" fill="#f5f5f7"/><text x="207.0" y="179.3" font-size="12" font-weight="500" text-anchor="middle">Manim</text>
<rect x="242.2" y="162" width="46.3" height="26" rx="13.0" fill="#f5f5f7"/><text x="265.4" y="179.3" font-size="12" font-weight="500" text-anchor="middle">RAG</text>
