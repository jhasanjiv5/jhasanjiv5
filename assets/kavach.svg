<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 224" width="480" height="224" role="img" aria-label="Kavach: Local security guard for AI coding agents: blocks leaked secrets and prompt injection">
<title>Kavach: Local security guard for AI coding agents: blocks leaked secrets and prompt injection</title>
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#000000" flood-opacity=".08"/>
  </filter>
  <filter id="soft" x="-10%" y="-10%" width="120%" height="140%">
    <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity=".08"/>
  </filter>
</defs>
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif; fill: #1d1d1f; }
  .muted { fill: #6e6e73; }
  .pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { opacity: .35; transform: scale(1.6); } }
  .drift { animation: drift 18s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(40px, 10px); } }
</style>

<rect x="8" y="8" width="464" height="208" rx="22" fill="#ffffff" stroke="#e5e5ea" stroke-width="1" filter="url(#shadow)"/>
<text x="34" y="50" font-size="12" font-weight="600" letter-spacing="0.6" style="fill:#d70015">SECURITY</text>
<text x="34" y="88" font-size="26" font-weight="700" letter-spacing="-0.5">Kavach</text>
<text x="34" y="118" font-size="15" class="muted">Local security guard for AI coding agents:</text>
<text x="34" y="139" font-size="15" class="muted">blocks leaked secrets and prompt injection</text>
<rect x="34.0" y="162" width="37.8" height="26" rx="13.0" fill="#f5f5f7"/><text x="52.9" y="179.3" font-size="12" font-weight="500" text-anchor="middle">Go</text>
<rect x="79.8" y="162" width="80.8" height="26" rx="13.0" fill="#f5f5f7"/><text x="120.2" y="179.3" font-size="12" font-weight="500" text-anchor="middle">Local LLM</text>
<rect x="168.6" y="162" width="92.6" height="26" rx="13.0" fill="#f5f5f7"/><text x="214.9" y="179.3" font-size="12" font-weight="500" text-anchor="middle">Agent hooks</text>
<text x="446" y="180" font-size="14" font-weight="500" text-anchor="end" style="fill:#0071e3">Learn more ›</text>
