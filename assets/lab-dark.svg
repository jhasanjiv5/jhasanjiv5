<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 224" width="480" height="224" role="img" aria-label="30 Ideas · 30 Days: 29 AI prototypes in a month, each scored for maturity, research and business value">
<title>30 Ideas · 30 Days: 29 AI prototypes in a month, each scored for maturity, research and business value</title>
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#000000" flood-opacity=".55"/>
  </filter>
  <filter id="soft" x="-10%" y="-10%" width="120%" height="140%">
    <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity=".55"/>
  </filter>
</defs>
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif; fill: #f5f5f7; }
  .muted { fill: #a1a1a6; }
  .pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { opacity: .35; transform: scale(1.6); } }
  .drift { animation: drift 18s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(40px, 10px); } }
</style>

<rect x="8" y="8" width="464" height="208" rx="22" fill="#1c1c1e" stroke="#38383a" stroke-width="1" filter="url(#shadow)"/>
<text x="34" y="50" font-size="12" font-weight="600" letter-spacing="0.6" style="fill:#2997ff">BUILT</text>
<text x="34" y="88" font-size="26" font-weight="700" letter-spacing="-0.5">30 Ideas · 30 Days</text>
<text x="34" y="118" font-size="15" class="muted">29 AI prototypes in a month, each scored</text>
<text x="34" y="139" font-size="15" class="muted">for maturity, research and business value</text>
<rect x="34.0" y="162" width="54.5" height="26" rx="13.0" fill="#2c2c2e"/><text x="61.2" y="179.3" font-size="12" font-weight="500" text-anchor="middle">Swift</text>
<rect x="96.5" y="162" width="87.4" height="26" rx="13.0" fill="#2c2c2e"/><text x="140.2" y="179.3" font-size="12" font-weight="500" text-anchor="middle">TypeScript</text>
<rect x="191.8" y="162" width="37.8" height="26" rx="13.0" fill="#2c2c2e"/><text x="210.7" y="179.3" font-size="12" font-weight="500" text-anchor="middle">Go</text>
<rect x="237.6" y="162" width="63.2" height="26" rx="13.0" fill="#2c2c2e"/><text x="269.3" y="179.3" font-size="12" font-weight="500" text-anchor="middle">Python</text>
