<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 224" width="480" height="224" role="img" aria-label="Saathi: An audio companion that narrates where you walk, without ever storing your location">
<title>Saathi: An audio companion that narrates where you walk, without ever storing your location</title>
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#000000" flood-opacity=".55"/>
  </filter>
  <filter id="soft" x="-10%" y="-10%" width="120%" height="140%">
    <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity=".55"/>
  </filter>
</defs>
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif; fill: #f5f5f7; }
  .muted { fill: #a1a1a6; }
  .pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { opacity: .35; transform: scale(1.6); } }
  .drift { animation: drift 18s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(40px, 10px); } }
</style>

<rect x="8" y="8" width="464" height="208" rx="22" fill="#1c1c1e" stroke="#38383a" stroke-width="1" filter="url(#shadow)"/>
<text x="34" y="50" font-size="12" font-weight="600" letter-spacing="0.6" style="fill:#30d158">BUILT</text>
<text x="34" y="88" font-size="26" font-weight="700" letter-spacing="-0.5">Saathi</text>
<text x="34" y="118" font-size="15" class="muted">An audio companion that narrates where you</text>
<text x="34" y="139" font-size="15" class="muted">walk, without ever storing your location</text>
<rect x="34.0" y="162" width="64.8" height="26" rx="13.0" fill="#2c2c2e"/><text x="66.4" y="179.3" font-size="12" font-weight="500" text-anchor="middle">Swift 6</text>
<rect x="106.8" y="162" width="106.2" height="26" rx="13.0" fill="#2c2c2e"/><text x="159.9" y="179.3" font-size="12" font-weight="500" text-anchor="middle">On-device LLM</text>
<rect x="221.0" y="162" width="78.6" height="26" rx="13.0" fill="#2c2c2e"/><text x="260.3" y="179.3" font-size="12" font-weight="500" text-anchor="middle">HealthKit</text>
<text x="446" y="180" font-size="14" font-weight="500" text-anchor="end" style="fill:#2997ff">Learn more ›</text>
</svg>
