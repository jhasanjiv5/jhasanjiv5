<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="I turn AI research into working systems. Explainable, privacy-aware assistants that understand the places and people around them. 7 peer-reviewed papers; 6+ yrs applied AI research; 30 apps built in 30 days; 10+ students mentored">
<title>I turn AI research into working systems. Explainable, privacy-aware assistants that understand the places and people around them. 7 peer-reviewed papers; 6+ yrs applied AI research; 30 apps built in 30 days; 10+ students mentored</title>
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#000000" flood-opacity=".55"/>
  </filter>
  <filter id="soft" x="-10%" y="-10%" width="120%" height="140%">
    <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity=".55"/>
  </filter>
</defs>
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif; fill: #f5f5f7; }
  .muted { fill: #a1a1a6; }
  .pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { opacity: .35; transform: scale(1.6); } }
  .drift { animation: drift 18s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(40px, 10px); } }
</style>

<defs>
